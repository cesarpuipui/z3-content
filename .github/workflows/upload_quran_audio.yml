      max-parallel: 2
      fail-fast: false

    steps:
      - name: Check if reciter should run
        id: should-run
        run: |
          SELECTED="${{ github.event.inputs.reciter }}"
          CURRENT="${{ matrix.reciter.id }}"
          if [ -n "$SELECTED" ] && [ "$SELECTED" != "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create output directory
        if: steps.should-run.outputs.skip != 'true'
        run: mkdir -p audio/quran/${{ matrix.reciter.id }}

      - name: Download all 114 surahs from MP3Quran.net
        if: steps.should-run.outputs.skip != 'true'
        run: |
          SERVER="${{ matrix.reciter.server }}"
          RECITER_ID="${{ matrix.reciter.id }}"
          MISSING=0

          echo "🎤 Downloading from: $SERVER"
          echo "📂 Saving to: audio/quran/$RECITER_ID/"

          for surah in $(seq -w 1 114); do
            FILENAME="${surah}.mp3"
            URL="${SERVER}/${FILENAME}"
            OUTPUT="audio/quran/${RECITER_ID}/${FILENAME}"

            # Skip if already exists
            if [ -f "$OUTPUT" ] && [ -s "$OUTPUT" ]; then
              echo "⏭️  $FILENAME already exists, skipping"
              continue
            fi

            # Download with retry
            SUCCESS=false
            for attempt in 1 2 3; do
              echo "📥 Downloading surah $surah (attempt $attempt)..."
              HTTP_CODE=$(curl -s -L -w "%{http_code}" -o "$OUTPUT" \
                -H "User-Agent: Mozilla/5.0 (Linux; Android 10)" \
                --connect-timeout 30 \
                --max-time 120 \
                "$URL" 2>/dev/null)

              if [ "$HTTP_CODE" = "200" ] && [ -s "$OUTPUT" ]; then
                FILE_SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null)
                if [ "$FILE_SIZE" -gt 1000 ]; then
                  echo "✅ Surah $surah: $FILE_SIZE bytes"
                  SUCCESS=true
                  break
                else
                  echo "⚠️  Surah $surah: file too small ($FILE_SIZE bytes), retrying..."
                  rm -f "$OUTPUT"
                fi
              else
                echo "⚠️  Surah $surah: HTTP $HTTP_CODE, retrying..."
                rm -f "$OUTPUT"
              fi

              WAIT=$((attempt * 5))
              echo "⏳ Waiting ${WAIT}s before retry..."
              sleep $WAIT
            done

            if [ "$SUCCESS" = "false" ]; then
              echo "❌ FAILED to download surah $surah after 3 attempts"
              MISSING=$((MISSING + 1))
            fi
          done

          DOWNLOADED=$(ls -1 audio/quran/${RECITER_ID}/*.mp3 2>/dev/null | wc -l)
          echo "📊 Downloaded: $DOWNLOADED / 114 (missing: $MISSING)"

          if [ "$DOWNLOADED" -lt 114 ]; then
            echo "❌ MISSING $((114 - DOWNLOADED)) surahs — failing job"
            exit 1
          fi

      - name: Create ZIP archive
        if: steps.should-run.outputs.skip != 'true'
        run: |
          cd audio/quran
          zip -r "${{ matrix.reciter.id }}.zip" "${{ matrix.reciter.id }}/"
          ls -lh "${{ matrix.reciter.id }}.zip"
          cd ../..

      - name: Upload artifact
        if: steps.should-run.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quran-audio-${{ matrix.reciter.id }}
          path: audio/quran/${{ matrix.reciter.id }}.zip
          retention-days: 1

  release:
    needs: upload-reciter-audio
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: audio/quran
          pattern: quran-audio-*
          merge-multiple: true

      - name: Flatten artifact structure
        run: |
          find audio/quran -name "*.zip" -exec mv {} audio/quran/ \;
          find audio/quran -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          ls -lh audio/quran/

      - name: Upload to GitHub Release
        env:
          TAG: ${{ github.event.inputs.tag || 'v1.0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "Quran Audio v1.0" \
            --notes "Full-surah Quran audio from MP3Quran.net. Credit: https://www.mp3quran.net" \
            --latest=false \
            audio/quran/*.zip 2>/dev/null || \
          gh release upload "$TAG" \
            audio/quran/*.zip \
            --clobber
