# .github/workflows/upload_quran_audio.yml
#
# Downloads full-surah Quran audio from MP3Quran.net for ALL reciters,
# zips each reciter folder, and uploads ZIPs to GitHub Releases.
#
# REPO: z3-content (public content repo)
# Release structure:
#   v1.0/
#     audio/quran/{folder}.zip
#
# Credit: MP3Quran.net — https://www.mp3quran.net
#
# Usage:
#   Actions tab → "Upload Quran Audio to Releases" → "Run workflow"

name: Upload Quran Audio to Releases

on:
  workflow_dispatch:
    inputs:
      reciter:
        description: 'Reciter folder to upload (leave empty for all)'
        required: false
        default: ''
        type: string
      tag:
        description: 'Release tag'
        required: false
        default: 'v1.0'
        type: string

jobs:
  upload-reciter-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        reciter:
