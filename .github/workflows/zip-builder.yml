      max-parallel: 2
      fail-fast: false

    steps:
      - name: Prepare workspace
        run: |
          mkdir -p output/${{ matrix.reciter.id }}/timings
          echo "🎤 Reciter: ${{ matrix.reciter.id }}"
          echo "🌐 Server: ${{ matrix.reciter.server }}"

      - name: Download 114 surah MP3s
        id: download
        run: |
          SERVER="${{ matrix.reciter.server }}"
          ID="${{ matrix.reciter.id }}"
          MISSING=0
          TOTAL=0
          MISSING_LIST=""

          for surah in $(seq -w 1 114); do
            PADDED=$(printf "%03d" "$surah")
            URL="${SERVER}${PADDED}.mp3"
            OUTPUT="output/${ID}/${PADDED}.mp3"

            SUCCESS=false
            for attempt in 1 2 3; do
              HTTP_CODE=$(curl -s -L -w "%{http_code}" -o "$OUTPUT" \
                -H "User-Agent: Mozilla/5.0 (Linux; Android 10)" \
                --connect-timeout 30 --max-time 120 \
                "$URL" 2>/dev/null)

              if [ "$HTTP_CODE" = "200" ] && [ -s "$OUTPUT" ]; then
                SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null || echo 0)
                if [ "$SIZE" -gt 1000 ]; then
                  echo "  ✅ ${PADDED}.mp3 (${SIZE} bytes)"
                  SUCCESS=true
                  TOTAL=$((TOTAL + 1))
                  break
                else
                  echo "  ⚠️  ${PADDED}.mp3 too small (${SIZE} bytes), retry $attempt"
                  rm -f "$OUTPUT"
                fi
              else
                echo "  ⚠️  ${PADDED}.mp3 HTTP $HTTP_CODE, retry $attempt"
                rm -f "$OUTPUT"
              fi
              sleep $((attempt * 3))
            done

            if [ "$SUCCESS" = "false" ]; then
              echo "  ❌ ${PADDED}.mp3 FAILED"
              MISSING=$((MISSING + 1))
              MISSING_LIST="${MISSING_LIST} ${PADDED}"
            fi
          done

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          echo "missing_list=$MISSING_LIST" >> "$GITHUB_OUTPUT"

          if [ "$MISSING" -gt 3 ]; then
            echo ""
            echo "❌ Too many missing surahs ($MISSING):${MISSING_LIST}"
            echo "   Failing job."
            exit 1
          fi

      - name: Download timing JSONs (optional)
        id: timings
        continue-on-error: true
        run: |
          ID="${{ matrix.reciter.id }}"
          TIMING_COUNT=0

          # Try everyayah.com timing data (word-level timestamps)
          # Format: {surah3digit}.json — gracefully skip if unavailable
          EVERYAYAH_BASE="https://everyayah.com/data/${{ matrix.reciter.id }}/"

          for surah in $(seq -w 1 114); do
            PADDED=$(printf "%03d" "$surah")
            JSON_URL="${EVERYAYAH_BASE}${PADDED}.json"
            JSON_OUT="output/${ID}/timings/${PADDED}.json"

            if curl -s -L --connect-timeout 10 --max-time 30 \
              -o "$JSON_OUT" "$JSON_URL" 2>/dev/null && [ -s "$JSON_OUT" ]; then
              # Validate it's actually JSON, not an HTML error page
              if head -c 1 "$JSON_OUT" | grep -q '{'; then
                echo "  ✅ ${PADDED}.json timing"
                TIMING_COUNT=$((TIMING_COUNT + 1))
              else
                rm -f "$JSON_OUT"
              fi
            else
              rm -f "$JSON_OUT"
            fi
          done

          echo "timing_count=$TIMING_COUNT" >> "$GITHUB_OUTPUT"
          echo ""
          echo "📊 Timing files downloaded: $TIMING_COUNT / 114"

      - name: Create flat ZIP
        run: |
          ID="${{ matrix.reciter.id }}"
          cd "output/${ID}"

          # Flat structure: 001.mp3 … 114.mp3 at root, timings/ folder if present
          ZIP_ARGS=()
          for f in *.mp3; do
            [ -f "$f" ] && ZIP_ARGS+=("$f")
          done
          if [ -d "timings" ] && [ "$(ls -A timings/ 2>/dev/null)" ]; then
            ZIP_ARGS+=("timings/")
          fi

          zip -r "../../${ID}.zip" "${ZIP_ARGS[@]}"
          cd ../..

          ZIP_SIZE=$(stat -c%s "${ID}.zip" 2>/dev/null)
          echo "📦 ZIP: ${ID}.zip — ${ZIP_SIZE} bytes"

      - name: Validate ZIP structure
        run: |
          ID="${{ matrix.reciter.id }}"
          echo "🔍 Validating ${ID}.zip..."

          # Count MP3s at root level (no nested folder)
          MP3_COUNT=$(unzip -l "${ID}.zip" | grep -c '\.mp3$' || echo 0)
          HAS_NESTED=$(unzip -l "${ID}.zip" | grep -c "${ID}/" || echo 0)
          TIMING_IN_ZIP=$(unzip -l "${ID}.zip" | grep -c 'timings/' || echo 0)

          echo "  MP3s in ZIP: $MP3_COUNT"
          echo "  Nested folder: $([ $HAS_NESTED -gt 0 ] && echo 'YES (BAD)' || echo 'NO (GOOD)')"
          echo "  Timing files: $TIMING_IN_ZIP"

          if [ "$MP3_COUNT" -lt 111 ]; then
            echo "❌ Only $MP3_COUNT MP3s — too few"
            exit 1
          fi
          if [ "$HAS_NESTED" -gt 0 ]; then
            echo "❌ ZIP contains nested folder — must be flat"
            exit 1
          fi
          echo "✅ ZIP structure valid"

      - name: Upload ZIP to release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0 \
            "${{ matrix.reciter.id }}.zip" \
            --clobber
          echo "✅ Uploaded audio/quran/${{ matrix.reciter.id }}.zip"

      - name: Save stats artifact
        if: always()
        run: |
          ZIP_SIZE=$(stat -c%s "${{ matrix.reciter.id }}.zip" 2>/dev/null || echo 0)
          cat > stats.json <<EOF
          {
            "id": "${{ matrix.reciter.id }}",
            "mp3_count": ${{ steps.download.outputs.total || 0 }},
            "missing": ${{ steps.download.outputs.missing || 0 }},
            "missing_list": "${{ steps.download.outputs.missing_list || '' }}",
            "zip_size": $ZIP_SIZE,
            "timings": ${{ steps.timings.outputs.timing_count || 0 }}
          }
          EOF
          cat stats.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stats-${{ matrix.reciter.id }}
          path: stats.json
          retention-days: 7

  # ── Final summary ─────────────────────────────────────────────
  summary:
    needs: zip-reciter
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all stats
        uses: actions/download-artifact@v4
        with:
          pattern: stats-*
          merge-multiple: true
          path: stats/

      - name: Print summary table
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  RECITER ZIP BUILD SUMMARY"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          printf "| %-14s | %5s | %7s | %12s | %8s |\n" \
            "Reciter ID" "MP3s" "Missing" "ZIP Size" "Timings"
          printf "|-%-14s-|-%-5s-|-%-7s-|-%-12s-|-%-8s-|\n" \
            "--------------" "-----" "-------" "------------" "--------"

          SUCCESS=0
          FAILED=0

          for f in stats/stats-*.json; do
            [ -f "$f" ] || continue
            id=$(jq -r '.id // "?"' "$f")
            mp3=$(jq -r '.mp3_count // 0' "$f")
            miss=$(jq -r '.missing // 0' "$f")
            size=$(jq -r '.zip_size // 0' "$f")
            time=$(jq -r '.timings // 0' "$f")

            # Human-readable size
            if [ "$size" -gt 1048576 ]; then
              size_h="$(echo "scale=1; $size / 1048576" | bc) MB"
            elif [ "$size" -gt 1024 ]; then
              size_h="$(echo "scale=1; $size / 1024" | bc) KB"
            else
              size_h="${size} B"
            fi

            miss_list=$(jq -r '.missing_list // ""' "$f")
            if [ "$miss" -gt 3 ]; then
              status="❌"
              FAILED=$((FAILED + 1))
            else
              status="✅"
              SUCCESS=$((SUCCESS + 1))
            fi

            printf "| %s %-12s | %5s | %5s %s | %12s | %8s |\n" \
              "$status" "$id" "$mp3" "$miss" "" "$size_h" "$time"
          done

          echo ""
          echo "───────────────────────────────────────────────────────────────"
          echo "  ✅ Success: $SUCCESS  |  ❌ Failed: $FAILED  |  Total: $((SUCCESS + FAILED))"
          echo "───────────────────────────────────────────────────────────────"
          echo ""
          echo "Release: https://github.com/\${{ github.repository }}/releases/tag/v1.0"
