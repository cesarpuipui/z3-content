# .github/workflows/zip-builder.yml
#
# Builds clean, flat-structure ZIP files for every Quran reciter.
# Downloads 114 surahs from MP3Quran.net, packages into flat ZIPs,
# and uploads to the v1.0 release tag.
#
# Trigger: manual (workflow_dispatch)
# Credit: MP3Quran.net — https://www.mp3quran.net

name: Build Reciter ZIPs

on:
  workflow_dispatch:

jobs:
  # ── Ensure the release exists ─────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release tag if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.0 2>/dev/null; then
            gh release create v1.0 \
              --title "Quran Reciters v1.0" \
              --notes "Auto-generated reciter ZIPs from mp3quran.net" \
              --latest=false
            echo "✅ Created release v1.0"
          else
            echo "✅ Release v1.0 already exists"
          fi

  # ── Build ZIPs for all reciters ────────────────────────────────
  zip-reciter:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        reciter:
          - id: akdr
            server: https://server6.mp3quran.net/akdr/
